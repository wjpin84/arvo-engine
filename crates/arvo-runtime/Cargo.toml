[package]
name = "arvo-runtime"
description = "The Tauri desktop host: owns the window, the async runtime, and the bridge between the workbench UI and the platform."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix is required: a lib and bin of the same name collide on
# Windows. See rust-lang/cargo#8519.
name = "arvo_runtime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Dyn-compatible async trait methods for `source::Source`, which is handed
# around as `Box<dyn Source>`. Native async-in-trait is not dyn-compatible.
# Already in the graph via tonic, so this is a manifest line and no build.
async-trait = "0.1.92"
arvo-data.workspace = true
arvo-nautilus.workspace = true
arvo-portfolio.workspace = true
arvo-research.workspace = true
blake3 = "1.8.7"
chrono.workspace = true
arvo-core.workspace = true
arvo-mcp.workspace = true
arvo-oauth.workspace = true
arvo-views.workspace = true
arvo-plugin-host.workspace = true
serde.workspace = true
serde_json = "1"
# For the one discovery GET the refresh path needs; already in the graph.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# `time` for the stream's heartbeat and reconnect backoff — the workspace
# default is rt+macros only, and relying on another crate in the graph to
# have turned this on is how a feature-unification change becomes a build
# break in an unrelated crate.
tokio = { workspace = true, features = ["time"] }
tauri = { version = "2", features = [] }
# The live price stream. rustls with the platform's own roots, matching what
# reqwest already pulls in, so this adds a websocket rather than a second TLS
# stack. See `stream`.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "rustls-tls-native-roots",
] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Yahoo frames the stream as base64 protobuf. Both are already compiled in
# this graph — prost via the plugin host, base64 via reqwest — so decoding it
# costs two direct dependency lines and no new build.
prost.workspace = true
base64 = "0.22"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2.4.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror.workspace = true

[dev-dependencies]
blake3 = "1.8.7"
log = "0.4"
tempfile = "3.27.0"
