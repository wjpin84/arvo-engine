[package]
name = "arvo-runtime"
description = "The Tauri desktop host: owns the window, the async runtime, and the bridge between the workbench UI and the platform."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix is required: a lib and bin of the same name collide on
# Windows. See rust-lang/cargo#8519.
name = "arvo_runtime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arvo-data.workspace = true
arvo-nautilus.workspace = true
arvo-research.workspace = true
chrono.workspace = true
arvo-core.workspace = true
arvo-plugin-host.workspace = true
serde.workspace = true
serde_json = "1"
tokio.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2.4.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror.workspace = true

[dev-dependencies]
log = "0.4"
tempfile = "3.27.0"
