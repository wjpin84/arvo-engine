[package]
name = "arvo-service"
description = "What Arvo does without a window: research, project, sources, rulesets and risk, shared by the Tauri host, the engine and the MCP server (#146)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arvo-alpaca.workspace = true
arvo-client.workspace = true
arvo-core.workspace = true
arvo-data.workspace = true
arvo-nautilus.workspace = true
# The sign-in flow itself: ADR-0028 puts it on this side of the wire.
arvo-oauth.workspace = true
arvo-plugin-host.workspace = true
arvo-portfolio.workspace = true
arvo-research.workspace = true
arvo-robinhood.workspace = true
arvo-views.workspace = true
arvo-yfinance.workspace = true
async-trait = "0.1.92"
base64 = "0.22"
blake3 = "1.8.7"
chrono.workspace = true
# The scheduler's cron expressions and its timers; `spawn_blocking` for the
# staleness check, which hashes files.
cron = "0.17.0"
dunce = "1"
trash = "5"
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing = "0.1.44"
walkdir = "2"

[dev-dependencies]
blake3 = "1.8.7"
tempfile = "3.27.0"
# `fetch` and `second_source` reach a vendor, so they need a runtime.
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
