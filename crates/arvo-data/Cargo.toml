[package]
name = "arvo-data"
description = "Market and research data sources behind a single provider trait."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# `source::Source` is held as `Box<dyn Source>`, and a native `async fn` in a
# trait is not dyn-compatible. Already in the graph via tonic.
async-trait = "0.1.92"
# For one warning in `source::ingest`: bars written, dividends not. It is the
# only thing distinguishing a failed distribution fetch from a vendor that does
# not serve them, since both report `None`. A facade crate — no cost when
# nothing subscribes.
tracing = "0.1.44"
# Already in the graph via nautilus-backtest; a real content hash that is
# stable across platforms and toolchains, which `DefaultHasher` is not.
blake3 = "1.8.7"
chrono.workspace = true
serde.workspace = true
# A signal series is metadata plus points in one file (#164); JSON is
# the shape serde already writes, and already compiled in this graph.
serde_json = "1"
thiserror.workspace = true
# Series are stored as Parquet (ADR-0039), beginning with recorded option
# quotes. No default features: the low-level reader and writer are enough, so
# arrow stays out of the graph. zstd is the one codec a file here is written
# with.
parquet = { version = "60", default-features = false, features = ["zstd"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = "3.27.0"
