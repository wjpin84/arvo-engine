[package]
name = "arvo-editor"
description = "Arvo's workbench UI: the Leptos front end that runs in the Tauri webview."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde.workspace = true
serde-wasm-bindgen = "0.6"
serde_json = "1"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.104", features = ["Window", "Document", "HtmlElement", "Element", "MediaQueryList", "console"] }
