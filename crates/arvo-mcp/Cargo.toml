[package]
name = "arvo-mcp"
description = "An MCP client: calling a remote tool server over HTTP."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
# Already in the graph via Tauri; rustls rather than native-tls so the build
# does not depend on a platform OpenSSL.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
