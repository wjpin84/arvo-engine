[package]
name = "arvo-research"
description = "The research domain Arvo owns: hypotheses, experiments, results, evidence."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Only for `erf`, which the Probabilistic Sharpe Ratio needs and std has not.
# Already in the build as a transitive dependency, so this adds no download.
libm = "0.2"
# For BarInterval only: the resolution an experiment ran at is part of its
# record, and one crate has to own that vocabulary.
arvo-data.workspace = true
# The gate, costs and trades, which the live path shares without the rest of this.
arvo-risk.workspace = true
# Content hash of an attachment's bytes, the way bars are pinned.
blake3 = "1.8.7"
chrono.workspace = true
serde.workspace = true
# `float_roundtrip`: a finding is numbers on disk, and serde_json's default
# float parsing is fast and not always correctly rounded. A real finding
# held 2^-44 and was read as the float above it, every time, and re-saved a
# step further on. With this a number reads back as the number written.
# Cargo unifies features, so every crate in the engine reads this way.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror.workspace = true
# The family sweep runs its configurations across the cores (#212).
rayon = "1.12.0"

[dev-dependencies]
tempfile = "3.27.0"
