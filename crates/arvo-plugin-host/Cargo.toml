[package]
name = "arvo-plugin-host"
description = "Loads and probes Arvo plugins: gRPC processes at a configured address."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arvo-core.workspace = true
# The Source trait, so a plugin-served source is a `dyn Source` like any other.
arvo-data.workspace = true
anyhow.workspace = true
# Dyn-compatible async trait methods, the way `arvo_data::Source` is declared.
async-trait = "0.1.92"
chrono.workspace = true
prost.workspace = true
# process, io-util and net for the supervisor, which spawns and reads a child
# and binds the port a served plugin hands back.
tokio = { workspace = true, features = ["process", "io-util", "net", "time", "sync"] }
# Serving on a listener bound first, so the port can be said before the
# first request (the handshake).
tokio-stream = { version = "0.1", features = ["net"] }
tonic.workspace = true
tonic-prost.workspace = true
tracing = "0.1"

[build-dependencies]
protoc-bin-vendored.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
arvo-plugin-stub = { path = "../../plugins/stub" }
