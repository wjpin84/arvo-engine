[workspace]
resolver = "2"
members = [
    "crates/arvo-core",
    "crates/arvo-data",
    "crates/arvo-research",
    "crates/arvo-risk",
    "crates/arvo-plugin-host",
    "crates/arvo-service",
    "crates/arvo-client",
    "crates/arvo-schedule",
    "crates/arvo-mcp",
    "crates/arvo-oauth",
    "app/arvo-views",
    "engines/arvo-nautilus",
    "crates/arvo-portfolio",
    "app/arvo-editor",
    "crates/arvo-execution",
    "integrations/arvo-alpaca",
    "integrations/arvo-robinhood",
    "integrations/arvo-yfinance",
    "app/arvo-runtime",
    "app/arvo-mcp-server",
    "app/arvo-engine",
]

# Single source of truth for versions shared across crates, so a bump happens
# once rather than per-manifest.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
arvo-core = { path = "crates/arvo-core" }
arvo-execution = { path = "crates/arvo-execution" }
arvo-alpaca = { path = "integrations/arvo-alpaca" }
arvo-robinhood = { path = "integrations/arvo-robinhood" }
arvo-yfinance = { path = "integrations/arvo-yfinance" }
arvo-data = { path = "crates/arvo-data" }
arvo-mcp = { path = "crates/arvo-mcp" }
arvo-oauth = { path = "crates/arvo-oauth" }
arvo-views = { path = "app/arvo-views" }
arvo-nautilus = { path = "engines/arvo-nautilus" }
arvo-portfolio = { path = "crates/arvo-portfolio" }
arvo-research = { path = "crates/arvo-research" }
arvo-risk = { path = "crates/arvo-risk" }
arvo-plugin-host = { path = "crates/arvo-plugin-host" }
arvo-service = { path = "crates/arvo-service" }
arvo-client = { path = "crates/arvo-client" }
arvo-schedule = { path = "crates/arvo-schedule" }

anyhow = "1.0.104"
# Already in the graph via Nautilus; sharing the version keeps one copy.
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
prost = "0.14.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
protoc-bin-vendored = "3.2.0"

# Must live in the *workspace root* manifest. Cargo ignores `[profile.*]` in
# member crates and warns about it — these settings sat in the app crate's own
# manifest and were silently doing nothing, so every release build ran at
# defaults. See tauri.app/concept/size/#cargo-configuration.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
