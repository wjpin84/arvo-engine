[package]
name = "arvo-desktop-ui"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.104", features = ["Window", "Document", "HtmlElement", "Element", "MediaQueryList"] }

[workspace]
members = ["src-tauri", "plugins/stub", "plugins/wasm-stub"]

# Must live in the *workspace root* manifest. Cargo ignores `[profile.*]` in
# member crates and warns about it — these settings sat in src-tauri/Cargo.toml
# and were silently doing nothing, so every release build so far ran at
# defaults. See tauri.app/concept/size/#cargo-configuration.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
