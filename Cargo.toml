[workspace]
resolver = "2"
members = [
    "crates/arvo-core",
    "crates/arvo-plugin-host",
    "crates/arvo-nautilus",
    "crates/arvo-editor",
    "crates/arvo-runtime",
    "plugins/stub",
    "plugins/wasm-stub",
]

# Single source of truth for versions shared across crates, so a bump happens
# once rather than per-manifest.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
arvo-core = { path = "crates/arvo-core" }
arvo-plugin-host = { path = "crates/arvo-plugin-host" }

anyhow = "1.0.104"
prost = "0.14.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
protoc-bin-vendored = "3.2.0"

# Must live in the *workspace root* manifest. Cargo ignores `[profile.*]` in
# member crates and warns about it — these settings sat in the app crate's own
# manifest and were silently doing nothing, so every release build ran at
# defaults. See tauri.app/concept/size/#cargo-configuration.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
