[package]
name = "arvo-mcp-server"
description = "Arvo as an MCP server over stdio: an agent can read research memory and run studies, never trade."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The research tier itself: the same code a script reaches over the engine's
# gRPC API, so an agent's run and a script's run are one run (ADR-0018).
arvo-engine = { path = "../arvo-engine" }
arvo-service.workspace = true
serde_json = "1"

[dev-dependencies]
tempfile = "3"
