[package]
name = "arvo-engine"
description = "Arvo's engine and its local gRPC API: research memory and research runs for every front end that is not the window (ADR-0018)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "arvo-engine"
path = "src/main.rs"

[dependencies]
arvo-alpaca.workspace = true
arvo-client.workspace = true
arvo-core.workspace = true
arvo-data.workspace = true
arvo-execution.workspace = true
arvo-nautilus.workspace = true
arvo-plugin-host.workspace = true
arvo-research.workspace = true
arvo-risk.workspace = true
arvo-robinhood.workspace = true
arvo-service.workspace = true
chrono.workspace = true
prost.workspace = true
rand = "0.8"
serde.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["net", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic.workspace = true
tonic-prost.workspace = true

[dev-dependencies]
tempfile = "3"
