# An engine release: one archive per platform on the GitHub release for the
# tag, named the way the desktop's tools/fetch_engine.py and its CI look
# for it — arvo-engine-<tag>-<triple>.zip holding arvo-engine and
# arvo-mcp-server. Runs on a pushed tag vX.Y.Z, or by hand for a tag that
# already exists (the first one, v0.1.0, predates this workflow).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build and release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            suffix: .exe
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            suffix: ""
          - os: macos-latest
            triple: aarch64-apple-darwin
            suffix: ""
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2

      - name: the tag is the workspace version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$TAG" ] || { echo "::error::Cargo.toml says $version, the tag says $TAG"; exit 1; }

      - name: build the daemon and the MCP server
        run: cargo build --release --locked --target ${{ matrix.triple }} -p arvo-engine -p arvo-mcp-server

      - name: stage the archive
        shell: bash
        run: |
          mkdir -p stage
          cp "target/${{ matrix.triple }}/release/arvo-engine${{ matrix.suffix }}" stage/
          cp "target/${{ matrix.triple }}/release/arvo-mcp-server${{ matrix.suffix }}" stage/
          # NOTICE as well as LICENSE: the LGPL-3.0 obligation on a linked
          # NautilusTrader attaches to the distributed binary, and the notice
          # is how it is discharged. An archive without it is the one artifact
          # where the file actually had to be.
          cp LICENSE* NOTICE stage/
          name="arvo-engine-${TAG}-${{ matrix.triple }}.zip"
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path stage/* -DestinationPath $name"
          else
            (cd stage && zip -r "../$name" .)
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$name" > "$name.sha256"; else shasum -a 256 "$name" > "$name.sha256"; fi
          ls -l "$name"*

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: |
            arvo-engine-${{ env.TAG }}-${{ matrix.triple }}.zip
            arvo-engine-${{ env.TAG }}-${{ matrix.triple }}.zip.sha256
          fail_on_unmatched_files: true
