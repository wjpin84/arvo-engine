[package]
name = "arvo-alpaca"
description = "Alpaca bars and corporate actions, on two feeds that are two datasets."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arvo-core.workspace = true
arvo-data.workspace = true
arvo-execution.workspace = true
async-trait = "0.1.92"
chrono.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde.workspace = true
serde_json = "1"
# The bar stream (#185): one websocket per session, the same crate and
# features the engine's price stream already uses, so nothing new is linked.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "rustls-tls-native-roots",
] }
# A derived idempotency key, so a retry of a lost reply cannot become a second
# order. Alpaca calls it `client_order_id`.
uuid = { version = "1.26", features = ["v5"] }

[dev-dependencies]
arvo-research.workspace = true
arvo-risk.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }
